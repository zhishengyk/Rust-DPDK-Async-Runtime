[package]
name = "binance-ws"
version.workspace = true
edition.workspace = true

[[bin]]
name = "binance-ws"
path = "../../src/binance_ws.rs"

[dependencies]
dpdk = { path = "../../crates/dpdk" }
metrics = { path = "../../crates/metrics" }
rt = { path = "../../crates/rt" }
arrayvec = "0.7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smoltcp = { version = "=0.12.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
sha1 = "0.10"
getrandom = "0.2"
rtrb = "=0.4.0"
hdrhistogram = { version = "=7.6.0", default-features = false }
